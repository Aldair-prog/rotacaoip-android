name: Stratton - Gerar APK

on:
  push:
    branches: [stratton-app, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura
        env:
          STRATTON_KEYSTORE: ${{ secrets.STRATTON_KEYSTORE }}
        run: |
          if [ -z "$STRATTON_KEYSTORE" ]; then
            echo "::error::Falta o segredo STRATTON_KEYSTORE. Sem ele o APK não instala por cima da versão anterior."
            exit 1
          fi
          echo "$STRATTON_KEYSTORE" | base64 -d > "$RUNNER_TEMP/stratton.keystore"
          echo "STRATTON_KEYSTORE_PATH=$RUNNER_TEMP/stratton.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          STRATTON_KEY_PASSWORD: ${{ secrets.STRATTON_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Stratton.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stratton-apk
          path: Stratton.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stratton-build-${{ github.run_number }}
          name: Stratton (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: APK do app Stratton. Baixe o arquivo Stratton.apk abaixo e instale no Android.
          files: Stratton.apk
