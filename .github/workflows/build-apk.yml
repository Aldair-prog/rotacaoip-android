name: Stratton - Gerar APK

# Um código só (Expo) gera os apps STRATTON e Connect Pay.
# Aqui saem os APKs Android; o iPhone sai pelo EAS (ver GUIA.md).
on:
  push:
    branches: [stratton-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: [stratton, connect]
    env:
      APP_BRAND: ${{ matrix.brand }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: |
          npm install --no-audit --no-fund
          npx expo install expo-notifications expo-print expo-sharing expo-build-properties expo-modules-core
          mkdir -p saida && cp package.json saida/package-resolvido.json

      - name: Conferir o código (TypeScript)
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee saida/typescript.txt

      - name: Gerar projeto Android
        run: npx expo prebuild -p android --no-install --clean

      - name: Compilar APK (celulares)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../saida/app-celular.apk

      - name: Compilar APK de teste (emulador)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../saida/app-emulador.apk

      - name: Assinar com a chave fixa
        id: key
        env:
          STRATTON_KEYSTORE: ${{ secrets.STRATTON_KEYSTORE }}
          STRATTON_KEY_PASSWORD: ${{ secrets.STRATTON_KEY_PASSWORD }}
        run: |
          NAME=$([ "$APP_BRAND" = stratton ] && echo Stratton || echo ConnectPay)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$STRATTON_KEYSTORE" ]; then
            echo "$STRATTON_KEYSTORE" | base64 -d > "$RUNNER_TEMP/k.keystore"
            for f in app-celular app-emulador; do
              "$BT/apksigner" sign --ks "$RUNNER_TEMP/k.keystore" --ks-key-alias stratton \
                --ks-pass env:STRATTON_KEY_PASSWORD --key-pass env:STRATTON_KEY_PASSWORD saida/$f.apk
            done
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem o segredo STRATTON_KEYSTORE: APK temporário."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          "$BT/apksigner" verify --print-certs saida/app-celular.apk | head -3
          mv saida/app-celular.apk "saida/$NAME.apk"
          mv saida/app-emulador.apk "saida/$NAME-emulador.apk"
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.brand }}
          path: saida/

  publicar:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Juntar
        run: |
          mkdir -p saida
          cp art/apk-stratton/Stratton.apk art/apk-connect/ConnectPay.apk saida/
          ls -la saida
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: stratton-build-${{ github.run_number }}
          name: Stratton + Connect Pay (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: ${{ github.event.head_commit.message }}
          files: |
            saida/Stratton.apk
            saida/ConnectPay.apk

  teste:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/teste-app.sh
      - name: Publicar resultados
        if: always()
        run: |
          tar czf resultados.tgz resultados || true
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: stratton-testes
          name: Testes no emulador (último build)
          prerelease: true
          make_latest: false
          files: resultados.tgz
